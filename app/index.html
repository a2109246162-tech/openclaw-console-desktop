<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>OpenClaw 控制台</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #1e1e2e 0%, #181825 100%);
    color: #e6e9f2; display: flex; flex-direction: column;
  }
  .titlebar { height: 42px; display: flex; align-items: center; -webkit-app-region: drag; padding: 0 6px 0 8px; background: rgba(255,255,255,0.02); }
  .gearbtn { -webkit-app-region: no-drag; width: 30px; height: 30px; border: none; background: transparent; color: #6c7086; font-size: 17px; cursor: pointer; border-radius: 7px; flex-shrink: 0; transition: all 0.2s; }
  .gearbtn:hover { background: rgba(137,180,250,0.15); color: #89b4fa; transform: rotate(45deg); }
  .titlebar .logo { font-size: 15px; font-weight: 600; letter-spacing: 0.5px; }
  .titlebar .logo span { color: #89b4fa; }
  .titlebar .sub { margin-left: 9px; font-size: 11px; color: #6c7086; }
  .winbtns { margin-left: auto; display: flex; }
  .winbtn { -webkit-app-region: no-drag; width: 38px; height: 30px; border: none; background: transparent; color: #6c7086; font-size: 13px; cursor: pointer; border-radius: 6px; }
  .winbtn:hover { background: rgba(255,255,255,0.08); }
  .winbtn.close:hover { background: #f38ba8; color: #fff; }

  .wrap { flex: 1; padding: 11px 16px 11px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
  .card { background: rgba(255,255,255,0.035); border: 1px solid rgba(255,255,255,0.06); border-radius: 13px; padding: 12px 15px; }
  .statrow { display: flex; align-items: center; justify-content: space-between; }
  .statlabel { font-size: 11px; color: #6c7086; letter-spacing: 2px; margin-bottom: 5px; }
  .state { display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 600; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #585b70; }
  .dot.on { background: #a6e3a1; animation: pulse 1.8s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(166,227,161,0.45); } 70% { box-shadow: 0 0 0 9px rgba(166,227,161,0); } 100% { box-shadow: 0 0 0 0 rgba(166,227,161,0); } }
  .state.run { color: #a6e3a1; }
  .state.stop { color: #9399b2; }
  .pid { font-size: 11px; color: #6c7086; text-align: right; }
  .divider { height: 1px; background: rgba(255,255,255,0.07); margin: 10px 0; }
  .mkey { font-size: 12px; color: #6c7086; }
  .mval { font-size: 13.5px; font-weight: 600; color: #cba6f7; }

  .row { display: flex; gap: 11px; }
  .btn { flex: 1; height: 46px; border: none; border-radius: 11px; cursor: pointer; font-size: 14.5px; font-weight: 600; color: #fff; transition: all 0.18s; }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-start { background: linear-gradient(135deg, #40a02b 0%, #52d576 100%); }
  .btn-start:not(:disabled):hover { transform: translateY(-1px); box-shadow: 0 5px 16px rgba(82,213,118,0.35); }
  .btn-stop { background: linear-gradient(135deg, #d20f39 0%, #f38ba8 100%); }
  .btn-stop:not(:disabled):hover { transform: translateY(-1px); box-shadow: 0 5px 16px rgba(243,139,168,0.35); }

  .section-title { font-size: 11px; color: #6c7086; letter-spacing: 2px; display: flex; justify-content: space-between; align-items: center; }
  .section-title a { color: #89b4fa; font-size: 12px; letter-spacing: 0.5px; cursor: pointer; text-decoration: none; }
  .section-title a:hover { text-decoration: underline; }

  /* 模型优先级链 */
  .chain { display: flex; flex-direction: column; gap: 6px; }
  .chain-item { display: flex; align-items: center; gap: 9px; padding: 9px 11px; border-radius: 10px; background: rgba(255,255,255,0.035); border: 1px solid rgba(255,255,255,0.06); }
  .chain-item.top { border-color: #89b4fa; background: linear-gradient(135deg, rgba(137,180,250,0.14), rgba(203,166,247,0.08)); }
  .chain-rank { width: 22px; height: 22px; border-radius: 50%; background: #313244; color: #9399b2; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .chain-item.top .chain-rank { background: #89b4fa; color: #1e1e2e; }
  .chain-info { flex: 1; min-width: 0; }
  .chain-name { font-size: 12.5px; font-weight: 600; }
  .chain-item.top .chain-name { color: #89b4fa; }
  .chain-sub { font-size: 10px; color: #6c7086; margin-top: 1px; }
  .chain-badge { font-size: 9.5px; padding: 1px 7px; border-radius: 10px; background: rgba(255,255,255,0.06); color: #9399b2; }
  .chain-item.top .chain-badge { background: rgba(137,180,250,0.2); color: #89b4fa; }
  .empty { text-align: center; color: #585b70; font-size: 12px; padding: 12px; }

  /* ---------- 设置开关 ---------- */
  .settings-card { background: rgba(255,255,255,0.035); border: 1px solid rgba(255,255,255,0.06); border-radius: 13px; padding: 11px 15px; }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; }
  .toggle-row + .toggle-row { border-top: 1px solid rgba(255,255,255,0.05); }
  .toggle-info { display: flex; flex-direction: column; gap: 2px; }
  .toggle-info .t-title { font-size: 13px; font-weight: 600; }
  .toggle-info .t-desc { font-size: 10.5px; color: #6c7086; }
  .switch { position: relative; width: 42px; height: 23px; flex-shrink: 0; cursor: pointer; }
  .switch input { display: none; }
  .slider { position: absolute; inset: 0; background: #313244; border-radius: 12px; transition: 0.2s; }
  .slider::before { content: ''; position: absolute; width: 17px; height: 17px; left: 3px; top: 3px; background: #9399b2; border-radius: 50%; transition: 0.2s; }
  .switch input:checked + .slider { background: #40a02b; }
  .switch input:checked + .slider::before { transform: translateX(19px); background: #fff; }

  /* ---------- token 用量 ---------- */
  .usage-card { background: rgba(255,255,255,0.035); border: 1px solid rgba(255,255,255,0.06); border-radius: 13px; padding: 11px 15px; }
  .usage-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .usage-head .label { font-size: 11px; color: #6c7086; letter-spacing: 2px; }
  .usage-head .total { font-size: 17px; font-weight: 700; color: #fab387; }
  .usage-head .total .w { font-size: 13px; color: #9399b2; font-weight: 500; }
  .usage-list { display: flex; flex-direction: column; gap: 6px; }
  .usage-item { display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
  .usage-item .umodel { color: #cdd6f4; }
  .usage-item .utokens { color: #fab387; font-weight: 600; }
  .usage-item .utokens .uw { color: #6c7086; font-weight: 400; font-size: 10.5px; margin-left: 4px; }
  .usage-empty { font-size: 11px; color: #585b70; text-align: center; padding: 4px; }

  .logbox { flex: 1; min-height: 70px; border-radius: 11px; overflow: hidden; background: #11111b; border: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; }
  .lhead { padding: 7px 13px; font-size: 11px; color: #6c7086; letter-spacing: 2px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; }
  .lbody { flex: 1; overflow-y: auto; padding: 9px 13px; font-family: "Cascadia Mono", Consolas, monospace; font-size: 11px; line-height: 1.7; color: #a6adc8; white-space: pre-wrap; user-select: text; }
  .lbody .t { color: #45475a; margin-right: 8px; }
  .lbody .ok { color: #a6e3a1; } .lbody .err { color: #f38ba8; } .lbody .info { color: #89b4fa; }
  ::-webkit-scrollbar { width: 7px; } ::-webkit-scrollbar-thumb { background: #313244; border-radius: 4px; } ::-webkit-scrollbar-track { background: transparent; }

  .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: none; align-items: center; justify-content: center; z-index: 100; }
  .modal-mask.show { display: flex; }
  .modal { width: 92%; max-width: 420px; background: #1e1e2e; border: 1px solid rgba(137,180,250,0.25); border-radius: 15px; padding: 19px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
  .modal h2 { font-size: 16px; margin-bottom: 14px; }
  .modal h2 span { color: #89b4fa; }
  .field { margin-bottom: 11px; }
  .field label { display: block; font-size: 11px; color: #6c7086; margin-bottom: 4px; letter-spacing: 1px; }
  .field input, .field select { width: 100%; height: 35px; background: #181825; border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; color: #e6e9f2; padding: 0 10px; font-size: 13px; font-family: inherit; outline: none; }
  .field input:focus, .field select:focus { border-color: #89b4fa; }
  .field input::placeholder { color: #45475a; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .modal-btns { display: flex; gap: 10px; margin-top: 4px; }
  .mbtn { flex: 1; height: 39px; border: none; border-radius: 9px; cursor: pointer; font-size: 14px; font-weight: 600; }
  .mbtn.cancel { background: #313244; color: #9399b2; }
  .mbtn.confirm { background: linear-gradient(135deg, #89b4fa, #cba6f7); color: #1e1e2e; }
  /* 排序列表项 */
  .sort-item { display: flex; align-items: center; gap: 9px; padding: 10px 11px; border-radius: 10px; background: #181825; border: 1px solid rgba(255,255,255,0.06); margin-bottom: 7px; }
  .sort-item .s-rank { width: 24px; height: 24px; border-radius: 50%; background: #89b4fa; color: #1e1e2e; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .sort-item .s-name { flex: 1; font-size: 13px; font-weight: 600; }
  .sort-item .s-sub { font-size: 10.5px; color: #6c7086; }
  .s-btns { display: flex; gap: 4px; }
  .s-btn { width: 28px; height: 28px; border: none; border-radius: 7px; background: rgba(255,255,255,0.05); color: #9399b2; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; }
  .s-btn:hover { background: rgba(137,180,250,0.2); color: #89b4fa; }
  .s-btn:disabled { opacity: 0.2; cursor: not-allowed; }
  .hint-row { font-size: 10.5px; color: #585b70; margin-top: -2px; margin-bottom: 11px; }
  /* 二维码弹窗 */
  .qr-box { display: flex; flex-direction: column; align-items: center; padding: 8px 0; }
  .qr-img { width: 260px; height: 260px; background: #fff; border-radius: 12px; padding: 10px; display: flex; align-items: center; justify-content: center; }
  .qr-img img { width: 100%; height: 100%; }
  .qr-tip { font-size: 12px; color: #9399b2; text-align: center; margin-top: 12px; line-height: 1.6; }
  .qr-link { word-break: break-all; font-size: 10px; color: #585b70; margin-top: 8px; padding: 8px; background: rgba(255,255,255,0.03); border-radius: 6px; max-height: 50px; overflow-y: auto; }
  .qr-loading { width: 260px; height: 260px; display: flex; align-items: center; justify-content: center; color: #6c7086; font-size: 13px; }
</style>
</head>
<body>
  <div class="titlebar">
    <button class="gearbtn" id="btnGear" title="设置模型优先级">⚙</button>
    <button class="gearbtn" id="btnQrcode" title="微信绑定二维码" style="margin-left:-2px">📱</button>
    <div class="logo">⚡ OpenClaw <span>控制台</span></div>
    <div class="sub">微信机器人</div>
    <div class="winbtns">
      <button class="winbtn" id="btnMin" title="最小化到托盘">—</button>
      <button class="winbtn close" id="btnClose" title="隐藏到托盘">✕</button>
    </div>
  </div>

  <div class="wrap">
    <div class="card">
      <div class="statrow">
        <div>
          <div class="statlabel">网关状态</div>
          <div class="state stop" id="state"><div class="dot" id="dot"></div><span id="stateText">检查中…</span></div>
        </div>
        <div class="pid" id="pid">端口 …</div>
      </div>
      <div class="divider"></div>
      <div class="statrow"><span class="mkey">当前模型</span><span class="mval" id="activeModel">—</span></div>
    </div>

    <div class="row">
      <button class="btn btn-start" id="btnStart">▶&nbsp;启动网关</button>
      <button class="btn btn-stop" id="btnStop">■&nbsp;关闭网关</button>
    </div>

    <div class="section-title">
      <span>模型优先级（点 ⚙ 调整顺序）</span>
      <a id="btnAddApi">＋ 添加 API</a>
    </div>
    <div class="chain" id="chain"></div>

    <div class="usage-card">
      <div class="usage-head">
        <span class="label">今日 TOKEN 消耗</span>
        <span class="total" id="usageTotal">0<span class="w"> / 0 tokens</span></span>
      </div>
      <div class="usage-list" id="usageList"><div class="usage-empty">暂无数据</div></div>
    </div>

    <div class="settings-card">
      <div class="toggle-row">
        <div class="toggle-info">
          <span class="t-title">开机自启网关</span>
          <span class="t-desc">开机后静默启动网关到托盘，不弹窗口</span>
        </div>
        <label class="switch"><input type="checkbox" id="tglAuto"><span class="slider"></span></label>
      </div>
      <div class="toggle-row">
        <div class="toggle-info">
          <span class="t-title">防休眠</span>
          <span class="t-desc">开启后系统不会自动睡眠，机器人持续在线</span>
        </div>
        <label class="switch"><input type="checkbox" id="tglPower"><span class="slider"></span></label>
      </div>
    </div>

    <div class="logbox">
      <div class="lhead"><span>操作日志</span><span id="clock"></span></div>
      <div class="lbody" id="log"></div>
    </div>
  </div>

  <!-- 微信绑定二维码弹窗 -->
  <div class="modal-mask" id="qrModal">
    <div class="modal" style="max-width:340px">
      <h2>微信 <span>绑定二维码</span></h2>
      <div class="qr-box" id="qrBox">
        <div class="qr-loading" id="qrLoading">正在获取二维码…</div>
      </div>
      <div class="modal-btns">
        <button class="mbtn cancel" id="qrClose">关闭</button>
      </div>
    </div>
  </div>

  <!-- 优先级排序弹窗 -->
  <div class="modal-mask" id="sortModal">
    <div class="modal">
      <h2>调整 <span>模型优先级</span></h2>
      <div class="hint-row">拖动顺序或用 ↑↓ 调整。排在最上面的优先使用，第一个不可用时自动切第二个。</div>
      <div id="sortList"></div>
      <div class="modal-btns">
        <button class="mbtn cancel" id="sortCancel">取消</button>
        <button class="mbtn confirm" id="sortConfirm">保存顺序</button>
      </div>
    </div>
  </div>

  <!-- 添加 API 模态框 -->
  <div class="modal-mask" id="addModal">
    <div class="modal">
      <h2>添加 <span>API 供应商</span></h2>
      <div class="field">
        <label>供应商（预设）</label>
        <select id="preset">
          <option value="deepseek|https://api.deepseek.com/v1|openai-completions|deepseek-flash|DeepSeek V4.1 Flash">DeepSeek 官方</option>
          <option value="ark|https://ark.cn-beijing.volces.com/api/v3|openai-completions||">火山方舟 Ark</option>
          <option value="openai|https://api.openai.com/v1|openai-completions|gpt-4o|GPT-4o">OpenAI</option>
          <option value="zhipu|https://open.bigmodel.cn/api/paas/v4|openai-completions|glm-4-flash|GLM-4 Flash">智谱 GLM</option>
          <option value="qwen|https://dashscope.aliyuncs.com/compatible-mode/v1|openai-completions|qwen-flash|Qwen Flash">通义千问 Qwen</option>
          <option value="moonshot|https://api.moonshot.cn/v1|openai-completions|moonshot-v1-8k|Moonshot v1 8k">Moonshot Kimi</option>
          <option value="siliconflow|https://api.siliconflow.cn/v1|openai-completions|deepseek-ai/DeepSeek-V3|DeepSeek V3">SiliconFlow</option>
          <option value="custom||openai-completions||">自定义</option>
        </select>
      </div>
      <div class="grid2">
        <div class="field"><label>供应商标识（英文）</label><input id="pkey" placeholder="如 myopenai"></div>
        <div class="field"><label>显示名称</label><input id="plabel" placeholder="如 我的OpenAI"></div>
      </div>
      <div class="field"><label>API Base URL</label><input id="pbase" placeholder="https://api.example.com/v1"></div>
      <div class="field"><label>API Key</label><input id="pkey2" type="password" placeholder="sk-... 或 ark-..."></div>
      <div class="grid2">
        <div class="field"><label>模型 ID</label><input id="mid" placeholder="如 deepseek-flash"></div>
        <div class="field"><label>模型名称</label><input id="mname" placeholder="如 DeepSeek V4.1 Flash"></div>
      </div>
      <div class="hint-row">新模型自动加入优先级链末尾，可在 ⚙ 设置中调整顺序</div>
      <div class="modal-btns">
        <button class="mbtn cancel" id="addCancel">取消</button>
        <button class="mbtn confirm" id="addConfirm">添加</button>
      </div>
    </div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  let busy = false;
  let chain = [];
  let allModels = [];
  let modelMap = {};
  let sortArr = []; // 排序弹窗中的临时数组
  const LABELS = { ark: '火山方舟', deepseek: 'DeepSeek', openai: 'OpenAI', zhipu: '智谱', qwen: '通义千问', moonshot: 'Moonshot', siliconflow: 'SiliconFlow', anthropic: 'Anthropic' };

  function addLog(msg) {
    const cls = msg.indexOf('[OK]') === 0 ? 'ok' : (msg.indexOf('[x]') === 0 || msg.indexOf('[!]') === 0 ? 'err' : ((msg.indexOf('[i]') === 0 || msg.indexOf('[..]') === 0) ? 'info' : ''));
    const time = new Date().toLocaleTimeString('zh-CN', { hour12: false });
    const div = document.createElement('div');
    div.innerHTML = '<span class="t">' + time + '</span><span class="' + cls + '">' + msg + '</span>';
    $('log').appendChild(div); $('log').scrollTop = $('log').scrollHeight;
  }
  window.api.onLog((s) => addLog(s));

  function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }

  function renderChain() {
    const el = $('chain');
    el.innerHTML = '';
    if (!chain.length) { el.innerHTML = '<div class="empty">暂无模型，点击右上「添加 API」</div>'; return; }
    chain.forEach((key, i) => {
      const m = modelMap[key] || { providerLabel: key.split('/')[0], modelName: key.split('/')[1] || key, key };
      const item = document.createElement('div');
      item.className = 'chain-item' + (i === 0 ? ' top' : '');
      const badge = i === 0 ? '优先' : '备用' + i;
      item.innerHTML =
        '<div class="chain-rank">' + (i + 1) + '</div>' +
        '<div class="chain-info"><div class="chain-name">' + esc(m.providerLabel) + ' · ' + esc(m.modelName) + '</div>' +
        '<div class="chain-sub">' + esc(key) + '</div></div>' +
        '<span class="chain-badge">' + badge + '</span>';
      el.appendChild(item);
    });
    const top = modelMap[chain[0]];
    $('activeModel').textContent = top ? (top.providerLabel + ' · ' + top.modelName) : (chain[0] || '—');
  }

  function setBusy(b) { busy = b; $('btnStart').disabled = b; $('btnStop').disabled = b; }

  let lastChainSig = '';

  async function refresh() {
    try {
      const s = await window.api.status();
      const running = !!s.running;
      $('state').className = 'state ' + (running ? 'run' : 'stop');
      $('dot').className = 'dot' + (running ? ' on' : '');
      $('stateText').textContent = running ? (s.foreign ? '端口被占用' : '运行中') : '已停止';
      $('pid').textContent = s.running && s.pids.length ? ('PID ' + s.pids.join(', ')) : ('端口 ' + (s.port || 18789) + '（未监听）');
      $('clock').textContent = new Date().toLocaleTimeString('zh-CN', { hour12: false });
      allModels = s.allModels || [];
      modelMap = {}; allModels.forEach((m) => { modelMap[m.key] = m; });
      const nextChain = s.chain || [];
      // 数据签名未变 → 跳过 DOM 重建（避免闪烁与布局抖动）
      const sig = JSON.stringify(nextChain) + '|' + allModels.length;
      if (sig !== lastChainSig) {
        lastChainSig = sig;
        chain = nextChain;
        chain.forEach((k) => { if (!modelMap[k]) modelMap[k] = { providerLabel: LABELS[k.split('/')[0]] || k.split('/')[0], modelName: k.split('/')[1] || k, key: k }; });
        renderChain();
      }
      if (!busy) { $('btnStart').disabled = running && !s.foreign; $('btnStop').disabled = !running; }
    } catch (e) {}
  }

  async function guard(fn) {
    if (busy) { addLog('[!] 正在执行其他操作'); return; }
    setBusy(true);
    try { const r = await fn(); if (r && r.msg) addLog(r.msg); } catch (e) { addLog('[x] ' + (e.message || e)); }
    setBusy(false); refresh();
  }

  $('btnStart').onclick = () => guard(() => window.api.start());
  $('btnStop').onclick = () => guard(() => window.api.stop());
  $('btnMin').onclick = () => window.api.minimize();
  $('btnClose').onclick = () => window.api.minimize();

  // ---------- 齿轮按钮 → 优先级排序弹窗 ----------
  $('btnGear').onclick = () => {
    sortArr = chain.slice(); // 复制当前链
    renderSortList();
    $('sortModal').classList.add('show');
  };
  $('sortCancel').onclick = () => $('sortModal').classList.remove('show');

  function renderSortList() {
    const el = $('sortList');
    el.innerHTML = '';
    sortArr.forEach((key, i) => {
      const m = modelMap[key] || { providerLabel: key.split('/')[0], modelName: key.split('/')[1] || key };
      const item = document.createElement('div');
      item.className = 'sort-item';
      item.innerHTML =
        '<div class="s-rank">' + (i + 1) + '</div>' +
        '<div><div class="s-name">' + esc(m.providerLabel || LABELS[key.split('/')[0]] || key) + '</div>' +
        '<div class="s-sub">' + esc(m.modelName || key) + '</div></div>' +
        '<div class="s-btns">' +
          '<button class="s-btn up" ' + (i === 0 ? 'disabled' : '') + '>↑</button>' +
          '<button class="s-btn down" ' + (i === sortArr.length - 1 ? 'disabled' : '') + '>↓</button>' +
          '<button class="s-btn del">✕</button>' +
        '</div>';
      item.querySelector('.up').onclick = () => { if (i > 0) { [sortArr[i], sortArr[i-1]] = [sortArr[i-1], sortArr[i]]; renderSortList(); } };
      item.querySelector('.down').onclick = () => { if (i < sortArr.length - 1) { [sortArr[i], sortArr[i+1]] = [sortArr[i+1], sortArr[i]]; renderSortList(); } };
      item.querySelector('.del').onclick = () => { sortArr.splice(i, 1); renderSortList(); };
      el.appendChild(item);
    });
    if (!sortArr.length) el.innerHTML = '<div class="empty" style="padding:20px">列表为空</div>';
  }

  $('sortConfirm').onclick = async () => {
    if (!sortArr.length) { addLog('[!] 至少保留一个模型'); return; }
    try {
      await window.api.setPriority(sortArr);
      addLog('[OK] 优先级已更新：' + (modelMap[sortArr[0]] ? modelMap[sortArr[0]].providerLabel : sortArr[0]) + ' 为最高优先');
      $('sortModal').classList.remove('show');
      refresh();
    } catch (e) { addLog('[x] 保存失败: ' + (e.message || e)); }
  };

  // 添加 API
  $('btnAddApi').onclick = () => { $('addModal').classList.add('show'); applyPreset(); };
  $('addCancel').onclick = () => $('addModal').classList.remove('show');
  $('preset').onchange = applyPreset;
  function applyPreset() {
    const [pk, base, api, mid, mname] = $('preset').value.split('|');
    const opt = $('preset').selectedOptions && $('preset').selectedOptions[0];
    const zhName = opt ? opt.textContent.replace(/\s*(Ark|官方|Claude)?\s*$/, '') || pk : pk;
    $('pkey').value = pk === 'custom' ? '' : pk;
    $('plabel').value = pk === 'custom' ? '' : zhName; // 显示名称用中文名，不再填英文 key
    $('pbase').value = base; $('mid').value = mid || ''; $('mname').value = mname || '';
  }
  $('addConfirm').onclick = async () => {
    const providerKey = $('pkey').value.trim(), label = $('plabel').value.trim() || providerKey;
    const baseUrl = $('pbase').value.trim(), apiKey = $('pkey2').value.trim();
    const modelId = $('mid').value.trim(), modelName = $('mname').value.trim() || modelId;
    if (!providerKey || !baseUrl || !apiKey || !modelId) { addLog('[!] 请填写标识、URL、Key、模型ID'); return; }
    if (!/^[a-zA-Z0-9_-]+$/.test(providerKey)) { addLog('[!] 标识只能英文/数字/_/-'); return; }
    try {
      const r = await window.api.addProvider({ providerKey, label, baseUrl, apiKey, api: 'openai-completions', modelId, modelName });
      if (r && r.ok === false) { addLog('[x] ' + (r.msg || '添加失败')); return; }
      addLog('[OK] 已添加 ' + label + ' / ' + modelId);
      $('addModal').classList.remove('show'); $('pkey2').value = '';
      refresh();
    } catch (e) { addLog('[x] ' + (e.message || e)); }
  };

  // 状态 6 秒轮询；用量 30 秒（后端另有 60 秒缓存，避免频繁读盘）
  setInterval(() => { if (!busy) refresh(); }, 6000);
  setInterval(() => { if (!busy) refreshUsage(); }, 30000);

  // ---------- 设置开关 ----------
  async function loadSettings() {
    try {
      const s = await window.api.getSettings();
      $('tglAuto').checked = !!s.autoStart;
      $('tglPower').checked = !!s.autoPowerSave;
    } catch (e) {}
  }
  $('tglAuto').onchange = async (e) => {
    try { await window.api.setAutoStart(e.target.checked); } catch (er) { addLog('[x] 设置失败'); }
  };
  $('tglPower').onchange = async (e) => {
    try { await window.api.setPowerSave(e.target.checked); } catch (er) { addLog('[x] 设置失败'); }
  };

  // ---------- token 用量 ----------
  function fmtW(n) {
    const w = (n / 10000).toFixed(1);
    return w + 'w / ' + n.toLocaleString() + ' tokens';
  }
  async function refreshUsage() {
    try {
      const u = await window.api.getUsage();
      $('usageTotal').innerHTML = (u.grandTotal / 10000).toFixed(1) + '<span class="w"> / ' + u.grandTotal.toLocaleString() + ' tokens</span>';
      const el = $('usageList');
      if (!u.models.length) { el.innerHTML = '<div class="usage-empty">今日暂无消耗</div>'; return; }
      el.innerHTML = u.models.map((m) => {
        const name = m.provider ? (LABELS[m.provider] || m.provider) + ' · ' + m.model : m.model;
        return '<div class="usage-item"><span class="umodel">' + esc(name) + '</span><span class="utokens">' + (m.total / 10000).toFixed(1) + 'w<span class="uw">/ ' + m.total.toLocaleString() + ' tokens</span></span></div>';
      }).join('');
    } catch (e) {}
  }

  addLog('[i] 欢迎使用 OpenClaw 控制台');
  refresh();
  loadSettings();
  refreshUsage();

  // ---------- 微信绑定二维码 ----------
  async function loadQrcode() {
    $('qrBox').innerHTML = '<div class="qr-loading">正在获取二维码…<br><span style="font-size:11px;color:#585b70;margin-top:6px;display:inline-block">首次约需 20~40 秒</span></div>';
    addLog('[..] 正在获取微信绑定二维码…');
    // 动态进度提示（避免用户以为卡死）
    let sec = 0;
    const tick = setInterval(() => {
      sec += 2;
      const el = $('qrBox').querySelector('.qr-loading');
      if (el && $('qrBox').querySelector('#qrRetry') === null) {
        const sub = el.querySelector('span');
        if (sub) sub.textContent = '已等待 ' + sec + ' 秒，请稍候…';
      }
    }, 2000);
    try {
      const r = await window.api.getQrcode();
      clearInterval(tick);
      if (!r.ok) {
        $('qrBox').innerHTML =
          '<div class="qr-loading" style="color:#f38ba8;flex-direction:column">' + esc(r.msg || '获取失败') +
          '<button class="mbtn confirm" style="width:140px;height:34px;margin-top:14px;font-size:13px" id="qrRetry">重试</button></div>';
        const rb = document.getElementById('qrRetry');
        if (rb) rb.onclick = loadQrcode;
        addLog('[x] ' + (r.msg || '获取二维码失败'));
        return;
      }
      // 二维码图片由主进程本地生成（不依赖任何在线二维码服务，国内可用）
      const imgSrc = r.img || ('https://api.qrserver.com/v1/create-qr-code/?size=240x240&margin=8&data=' + encodeURIComponent(r.url));
      $('qrBox').innerHTML =
        '<div class="qr-img"><img src="' + imgSrc + '" alt="二维码" onerror="this.style.display=\'none\';this.parentNode.innerHTML=\'<div style=color:#f38ba8;font-size:12px>二维码图片加载失败<br>请点击下方链接</div>\'"></div>' +
        '<div class="qr-tip">用手机微信扫描上方二维码<br>扫码后在手机上确认即可绑定</div>' +
        '<div class="qr-link"><a href="' + esc(r.url) + '" target="_blank" style="color:#89b4fa">' + esc(r.url) + '</a></div>';
      addLog('[OK] 二维码已显示，请用微信扫码绑定');
    } catch (e) {
      clearInterval(tick);
      $('qrBox').innerHTML = '<div class="qr-loading" style="color:#f38ba8">获取失败: ' + esc(e.message || e) + '</div>';
      addLog('[x] 获取二维码失败: ' + (e.message || e));
    }
  }
  $('btnQrcode').onclick = () => { $('qrModal').classList.add('show'); loadQrcode(); };
  $('qrClose').onclick = async () => {
    $('qrModal').classList.remove('show');
    try { await window.api.cancelQrcode(); } catch (e) {}
  };
</script>
</body>
</html>
